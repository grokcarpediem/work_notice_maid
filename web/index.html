<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作提醒助手</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="header-row">
                <h1>工作提醒助手</h1>
                <button class="btn-refresh" onclick="refreshData()" title="刷新数据">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </button>
            </div>
            <p class="subtitle">管理你的提醒事项和免打扰时段</p>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="recurring">周期提醒</button>
            <button class="tab" data-tab="once">单次提醒</button>
            <button class="tab" data-tab="quiet">免打扰设置</button>
        </nav>

        <!-- 周期提醒 -->
        <section id="tab-recurring" class="tab-content active">
            <div class="toolbar">
                <h2>周期提醒</h2>
                <div class="toolbar-actions">
                    <button class="btn btn-primary" onclick="showRecurringForm()">+ 添加提醒</button>
                    <button class="btn btn-outline-danger" id="btn-clear-recurring" onclick="clearRecurring()">清空全部</button>
                </div>
            </div>

            <div id="recurring-form" class="form-card" style="display:none">
                <h3 id="recurring-form-title">添加周期提醒</h3>
                <input type="hidden" id="recurring-edit-id">
                <div class="form-group">
                    <label>提醒名称</label>
                    <input type="text" id="recurring-name" placeholder="如：站起来走一走">
                </div>
                <div class="form-group">
                    <label>提醒类型</label>
                    <select id="recurring-type" onchange="toggleRecurringFields()">
                        <option value="interval">固定间隔（每隔N分钟）</option>
                        <option value="daily">每天固定时间</option>
                    </select>
                </div>
                <div class="form-group" id="field-interval">
                    <label>间隔（分钟）</label>
                    <input type="number" id="recurring-interval" min="1" value="60" placeholder="60">
                </div>
                <div class="form-group" id="field-fixedtime" style="display:none">
                    <label>固定时间</label>
                    <input type="time" id="recurring-fixedtime" value="17:30">
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" onclick="saveRecurring()">保存</button>
                    <button class="btn btn-secondary" onclick="hideRecurringForm()">取消</button>
                </div>
            </div>

            <div id="recurring-list" class="card-list"></div>
            <div id="recurring-empty" class="empty-state">
                <p>暂无周期提醒</p>
                <p class="hint">点击"+ 添加提醒"创建你的第一个周期提醒</p>
            </div>
        </section>

        <!-- 单次提醒 -->
        <section id="tab-once" class="tab-content">
            <div class="toolbar">
                <h2>单次提醒</h2>
                <div class="toolbar-actions">
                    <button class="btn btn-primary" onclick="showOnceForm()">+ 添加提醒</button>
                    <button class="btn btn-outline-danger" id="btn-clear-once" onclick="clearOnce()">清空全部</button>
                </div>
            </div>

            <div id="once-form" class="form-card" style="display:none">
                <h3 id="once-form-title">添加单次提醒</h3>
                <input type="hidden" id="once-edit-id">
                <div class="form-group">
                    <label>提醒名称</label>
                    <input type="text" id="once-name" placeholder="如：送祝福">
                </div>
                <div class="form-group">
                    <label>提醒时间</label>
                    <input type="datetime-local" id="once-datetime">
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" onclick="saveOnce()">保存</button>
                    <button class="btn btn-secondary" onclick="hideOnceForm()">取消</button>
                </div>
            </div>

            <div id="once-list" class="card-list"></div>
            <div id="once-empty" class="empty-state">
                <p>暂无单次提醒</p>
                <p class="hint">点击"+ 添加提醒"创建重要日程提醒</p>
            </div>
        </section>

        <!-- 免打扰设置 -->
        <section id="tab-quiet" class="tab-content">
            <div class="toolbar">
                <h2>免打扰设置</h2>
                <div class="toolbar-actions">
                    <button class="btn btn-primary" onclick="showQuietForm()">+ 添加时段</button>
                    <button class="btn btn-outline-danger" id="btn-clear-quiet" onclick="clearQuiet()">清空全部</button>
                </div>
            </div>

            <div id="quiet-form" class="form-card" style="display:none">
                <h3 id="quiet-form-title">添加免打扰时段</h3>
                <input type="hidden" id="quiet-edit-id">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" id="quiet-name" placeholder="如：午休时间">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>开始时间</label>
                        <input type="time" id="quiet-start" value="12:00">
                    </div>
                    <div class="form-group">
                        <label>结束时间</label>
                        <input type="time" id="quiet-end" value="13:30">
                    </div>
                </div>
                <div class="form-group">
                    <label>生效日期</label>
                    <div class="weekday-picker">
                        <label class="weekday"><input type="checkbox" value="1"> 周一</label>
                        <label class="weekday"><input type="checkbox" value="2"> 周二</label>
                        <label class="weekday"><input type="checkbox" value="3"> 周三</label>
                        <label class="weekday"><input type="checkbox" value="4"> 周四</label>
                        <label class="weekday"><input type="checkbox" value="5"> 周五</label>
                        <label class="weekday"><input type="checkbox" value="6"> 周六</label>
                        <label class="weekday"><input type="checkbox" value="0"> 周日</label>
                    </div>
                    <p class="hint">不选择则每天生效</p>
                </div>
                <div class="form-actions">
                    <button class="btn btn-primary" onclick="saveQuiet()">保存</button>
                    <button class="btn btn-secondary" onclick="hideQuietForm()">取消</button>
                </div>
            </div>

            <div id="quiet-list" class="card-list"></div>
            <div id="quiet-empty" class="empty-state">
                <p>暂无免打扰时段</p>
                <p class="hint">添加午休、非工作日等免打扰时段</p>
            </div>
        </section>
    </div>

    <div id="toast" class="toast"></div>

    <!-- 自定义确认弹窗（替代 window.confirm，Wails WKWebView 不支持原生 confirm） -->
    <div id="confirm-overlay" class="confirm-overlay">
        <div class="confirm-dialog">
            <p id="confirm-message"></p>
            <div class="confirm-actions">
                <button class="btn btn-secondary" id="confirm-cancel">取消</button>
                <button class="btn btn-primary" id="confirm-ok">确定</button>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
